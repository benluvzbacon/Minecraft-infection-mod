name: build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Candy Infection (1.21.1)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod jar
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace build 2>&1 | tee build-output.txt

      # GitHub's automatic javac parsing keeps only the first line of each
      # diagnostic, so "cannot find symbol" arrives with no symbol or location.
      # Re-join each diagnostic into one annotation, and mirror it to the job
      # summary, so the detail is readable without the raw log blob.
      - name: Report compile errors
        if: failure()
        run: python3 tools/report_build_errors.py build-output.txt

      - name: Verify a mod jar was produced
        run: |
          set -euo pipefail
          echo "--- build/libs contents ---"
          ls -l build/libs
          JAR="$(find build/libs -maxdepth 1 -type f -name 'candyinfection-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          if [ -z "${JAR}" ]; then
            echo "::error::No mod jar was produced by the build."
            exit 1
          fi
          echo "Found mod jar: ${JAR}"
          # A real Fabric mod jar must contain the mod metadata, its compiled
          # classes and its assets. Fail the build loudly if any is missing.
          for required in fabric.mod.json dev/candyinfection assets/candyinfection; do
            if ! unzip -l "${JAR}" | grep -q "${required}"; then
              echo "::error::${JAR} is missing ${required} - this is not a usable mod jar."
              exit 1
            fi
          done
          # A class count alone is a weak signal, so check the classes that prove
          # the mod is whole: both entrypoints, a registry, an entity, a command.
          for required_class in \
            dev/candyinfection/CandyInfection.class \
            dev/candyinfection/client/CandyInfectionClient.class \
            dev/candyinfection/init/CandyBlocks.class \
            dev/candyinfection/init/CandyItems.class \
            dev/candyinfection/init/CandyEntities.class \
            dev/candyinfection/infection/InfectionRuntime.class \
            dev/candyinfection/entity/ConfectionerEntity.class \
            dev/candyinfection/command/CandyInfectionCommand.class; do
            if ! unzip -l "${JAR}" | grep -q "${required_class}"; then
              echo "::error::${JAR} is missing ${required_class} - the mod looks incomplete."
              exit 1
            fi
          done
          CLASS_COUNT="$(unzip -l "${JAR}" | grep -c '\.class$' || true)"
          echo "Compiled classes in jar: ${CLASS_COUNT}"
          if [ "${CLASS_COUNT}" -lt 60 ]; then
            echo "::error::Only ${CLASS_COUNT} classes in the jar - the mod looks incomplete."
            exit 1
          fi
          unzip -p "${JAR}" fabric.mod.json | head -n 20
          echo "${JAR}" > build/jar-path.txt
          cp "${JAR}" "build/Candy-Infection-1.21.1.jar"

      # Publish the jar inventory to the job summary so the contents are
      # verifiable without downloading the artifact blob.
      - name: Record jar contents
        if: always()
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'candyinfection-*.jar' ! -name '*-sources.jar' 2>/dev/null | sort | head -n 1 || true)"
          {
            echo "## Candy Infection build"
            echo
            if [ -z "${JAR}" ]; then
              echo "No mod jar was produced."
              exit 0
            fi
            echo "**Jar:** \`${JAR}\` ($(stat -c %s "${JAR}") bytes)"
            echo
            echo "| | count |"
            echo "|---|---|"
            echo "| .class files | $(unzip -l "${JAR}" | grep -c '\.class$' || true) |"
            echo "| .png textures | $(unzip -l "${JAR}" | grep -c '\.png$' || true) |"
            echo "| .json resources | $(unzip -l "${JAR}" | grep -c '\.json$' || true) |"
            echo "| recipes | $(unzip -l "${JAR}" | grep -c 'data/candyinfection/recipe/' || true) |"
            echo "| loot tables | $(unzip -l "${JAR}" | grep -c 'data/candyinfection/loot_table/' || true) |"
            echo
            echo '```'
            unzip -p "${JAR}" fabric.mod.json
            echo '```'
            echo
            echo "<details><summary>Full listing</summary>"
            echo
            echo '```'
            unzip -l "${JAR}"
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

          # Also emit the headline facts as annotations, which are readable
          # through the check-run annotations API.
          echo "::notice title=Mod jar::${JAR} - $(stat -c %s "${JAR}") bytes, $(unzip -l "${JAR}" | grep -c '\.class$' || true) classes, $(unzip -l "${JAR}" | grep -c '\.png$' || true) textures, $(unzip -l "${JAR}" | grep -c '\.json$' || true) json resources"
          echo "::notice title=fabric.mod.json id and version::$(unzip -p "${JAR}" fabric.mod.json | tr -d '\n ' | grep -o '\"id\":\"[a-z]*\",\"version\":\"[^\"]*\"' || echo 'see summary')"

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: Candy-Infection-1.21.1
          path: |
            build/Candy-Infection-1.21.1.jar
          if-no-files-found: error

      - name: Upload full build output (jar + sources)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Candy-Infection-1.21.1-full-libs
          path: build/libs/
          if-no-files-found: warn
